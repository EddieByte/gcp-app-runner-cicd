# =============================================================================
# Weekly re-scan of the images that are RUNNING in dev and prod.
#
# An image that was clean at build time can become vulnerable when a new CVE
# is published (a "zero-day" becomes a known CVE). This job never builds or
# deploys anything; it only scans and reports to the GitHub Security tab, and
# fails (visible red X + email) if a fixable HIGH/CRITICAL issue appears.
# Fix = cut a new release tag, which rebuilds with patched packages.
# =============================================================================
name: security-rescan

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC (07:17 Lagos)
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  rescan:
    name: Rescan ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    # No `environment:` here on purpose: prod's approval gate would block an
    # unattended scan. The scanner identity is read-only, so no gate is needed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            service: ${{ vars.CLOUD_RUN_SERVICE_DEV }}
          - environment: prod
            service: ${{ vars.CLOUD_RUN_SERVICE_PROD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SCANNER_SA }}   # read-only identity

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Find the image currently serving traffic
        id: image
        run: |
          IMAGE=$(gcloud run services describe "${{ matrix.service }}" \
                  --region "${{ vars.GCP_REGION }}" \
                  --format='value(spec.template.spec.containers[0].image)' || true)
          if [[ -z "$IMAGE" ]]; then
            echo "No service deployed in ${{ matrix.environment }}; skipping."
          fi
          echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Trivy scan (report)
        if: steps.image.outputs.ref != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pinned to commit SHA)
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          trivy-config: trivy.yaml
          format: sarif
          output: trivy-rescan.sarif
          exit-code: "0"

      - name: Upload results
        if: steps.image.outputs.ref != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-rescan.sarif
          category: trivy-rescan-${{ matrix.environment }}

      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        if: steps.image.outputs.ref != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pinned to commit SHA)
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          trivy-config: trivy.yaml
          format: table
