# Keeps dependencies current so security fixes arrive as reviewable PRs.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: docker          # php:8.3-fpm-alpine, composer:2
    directory: /docker
    schedule: { interval: weekly }
  - package-ecosystem: composer
    directory: /app
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /terraform/envs/dev
    schedule: { interval: weekly }
