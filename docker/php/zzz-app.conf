; -----------------------------------------------------------------------------
; PHP-FPM pool overrides. Named zzz-* so it loads AFTER the image's
; www.conf and zz-docker.conf and wins on any conflicting setting.
; -----------------------------------------------------------------------------
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
; Only Nginx in the same container talks to FPM: bind to loopback.
listen = 127.0.0.1:9000

; IMPORTANT: FPM clears env vars by default, which would hide Cloud Run's
; DB_*, APP_ENV and K_REVISION from PHP. Keep them.
clear_env = no

; Send PHP errors/warnings to the container log (Cloud Logging).
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Small, predictable footprint for a 512Mi Cloud Run instance.
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
