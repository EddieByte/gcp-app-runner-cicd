; Production-leaning PHP settings layered on php.ini-production.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 128M
max_execution_time = 30

; OPcache: code is immutable inside the image, so never re-check files.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000

; --- Hardening: shrink what an attacker could do if code were ever injected ---
; Never guess a script from PATH_INFO (defence in depth for CVE-2019-11043).
cgi.fix_pathinfo = 0
; The app never fetches URLs or runs shell commands, so neither can an attacker.
allow_url_fopen = Off
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl
; Hide the PHP version from response headers (also expose_php above).
