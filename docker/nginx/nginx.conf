# -----------------------------------------------------------------------------
# Nginx: serves static files and proxies PHP requests to PHP-FPM (127.0.0.1:9000).
# Runs as non-root, so pid and temp paths live under /tmp.
# In the cloud, /static/* is normally served by the GCS backend bucket at the
# load balancer and never reaches this container; the block below is the
# fallback for local runs and direct *.run.app access.
# Docs: https://nginx.org/en/docs/http/ngx_http_fastcgi_module.html
# -----------------------------------------------------------------------------
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs to stdout/stderr -> Cloud Logging picks them up automatically.
    access_log /dev/stdout;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;   # don't advertise the Nginx version
    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # Trust X-Forwarded-For from Google's load balancer for client IPs in logs.
    real_ip_header    X-Forwarded-For;
    set_real_ip_from  0.0.0.0/0;
    real_ip_recursive on;

    server {
        listen 8080 default_server;
        root   /var/www/html/public;
        index  index.php;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Static assets: served directly, cached by browsers/CDN.
        location /static/ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Never serve dotfiles (.env, .git, ...).
        location ~ /\. {
            deny all;
        }

        # Everything else goes to the front controller.
        location / {
            try_files $uri /index.php$is_args$args;
        }

        # Only real .php files are executed. `try_files $uri =404` plus NOT using
        # fastcgi_split_path_info / PATH_INFO closes CVE-2019-11043 (PHP-FPM +
        # Nginx remote code execution) and similar "/upload.jpg/x.php" tricks.
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            include       fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";  # mitigate httpoxy
            fastcgi_read_timeout 30s;
        }
    }
}
