; -----------------------------------------------------------------------------
; supervisord runs Nginx and PHP-FPM in the foreground in one container.
; Both log to stdout/stderr so Cloud Logging captures them.
; If either process dies, supervisord exits, the container exits, and Cloud Run
; replaces the instance (rather than limping on with half a web stack).
; -----------------------------------------------------------------------------
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=false
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=false
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Exit supervisord (and the container) when any program stops.
[eventlistener:quit_on_failure]
command=sh -c 'printf "READY\n"; read line; kill -TERM $(cat /tmp/supervisord.pid)'
events=PROCESS_STATE_STOPPED,PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
